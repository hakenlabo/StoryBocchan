<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>アニメ・プリプロ</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-view="map">
  <header class="app-header">
    <div class="brand">アニメ・プリプロ</div>
    <input id="project-title" class="project-title" type="text" aria-label="作品名">
    <nav class="view-tabs">
      <button class="tab active" type="button" data-view="map" title="マップと、下にタイムライン">マップ</button>
      <button class="tab" type="button" data-view="timeline" title="タイムラインを大きく表示">タイムライン</button>
      <button class="tab soon" type="button" data-view="vconte" title="ステップ4で追加予定">Vコンテ<small>準備中</small></button>
    </nav>
    <div class="settings">
      <label>fps <select id="setting-fps"></select></label>
      <label>画面比 <select id="setting-aspect"></select></label>
    </div>
    <div id="save-status" class="save-status">起動中…</div>
  </header>

  <div class="toolbar">
    <button id="btn-add" type="button" title="画面の真ん中にカードを作る（空白をダブルクリックでも作れます）">＋ カード</button>
    <button id="btn-add-child" type="button" title="選択中のカードに子カードを足す（Tab）">＋ 子カード</button>
    <button id="btn-draw" type="button" title="選択中のカードに絵を描く（カードの絵の部分をダブルクリックでも開けます）">✎ 描く</button>
    <button id="btn-peel" type="button" title="選択中のカードを保留トレイへ（Delete）">剥がす</button>
    <span class="sep"></span>
    <button id="btn-zoom-out" type="button" title="縮小">－</button>
    <span id="zoom-label" class="zoom-label">100%</span>
    <button id="btn-zoom-in" type="button" title="拡大">＋</button>
    <button id="btn-fit" type="button" title="全体を表示（⌘/Ctrl+0）">全体表示</button>
    <span class="hint">空白をダブルクリック・⌘+Enterでカード ／ 絵の部分をダブルクリックで描く ／ 重ねると子に ／ 線をクリックで切り離し</span>
  </div>

  <main class="workspace">
   <div class="workspace-main">
    <div id="map-viewport" class="map-viewport">
      <div id="map-world" class="map-world">
        <svg id="map-lines" class="map-lines" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="map-cards"></div>
      </div>
    </div>

    <aside id="tray" class="tray">
      <div class="tray-head">
        <button id="tray-toggle" class="tray-toggle" type="button" title="トレイを開く／たたむ">⇆</button>
        <span class="tray-title">保留トレイ</span>
        <span id="tray-count" class="tray-count"></span>
      </div>
      <p class="tray-hint">剥がしたカードはここに保留されます。消えません。<br>「戻す」かマップへドラッグで戻せます。</p>
      <ul id="tray-list" class="tray-list"></ul>
    </aside>
   </div>

    <section id="timeline" class="timeline">
      <div class="tl-head">
        <span class="tl-title">タイムライン</span>
        <span id="tl-total" class="tl-total"></span>
        <span class="tl-hint">マップからドラッグで採用 ／ ドラッグで並べ替え ／ 右端をドラッグか尺の数字をタップで尺を変更</span>
        <span class="tl-zoom">
          <button id="tl-zoom-out" type="button" title="縮める">－</button>
          <span id="tl-zoom-label" class="zoom-label">100%</span>
          <button id="tl-zoom-in" type="button" title="伸ばす">＋</button>
        </span>
      </div>
      <div id="tl-scroll" class="tl-scroll"><div id="tl-track" class="tl-track"></div></div>
    </section>
  </main>

  <div id="draw-panel" class="draw-panel" hidden>
    <div class="draw-bar">
      <button id="draw-prev" type="button">◀</button>
      <span id="draw-title" class="draw-title"></span>
      <button id="draw-next" type="button">▶</button>
      <span class="sep"></span>
      <button type="button" data-tool="pen" title="ペン（B）">ペン</button>
      <button type="button" data-tool="eraser" title="消しゴム（E）">消しゴム</button>
      <span id="draw-colors" class="draw-group"></span>
      <span id="draw-sizes" class="draw-group"></span>
      <span class="sep"></span>
      <button id="draw-undo" type="button" title="取り消し（⌘/Ctrl+Z）">↶ 取り消し</button>
      <button id="draw-redo" type="button" title="やり直し（⌘/Ctrl+Shift+Z）">↷ やり直し</button>
      <button id="draw-clear" type="button">全部消す</button>
      <button id="draw-close" class="primary" type="button" title="閉じる（Esc）">完了</button>
    </div>
    <div id="draw-stage" class="draw-stage"><canvas id="draw-canvas"></canvas></div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <!-- 読み込み順に意味があります（ES Modulesは使わない方針） -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/model.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/map.js"></script>
  <script src="js/tray.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
